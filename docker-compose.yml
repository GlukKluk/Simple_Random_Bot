services:
  bot:
    build:
      dockerfile: Dockerfile
    restart: always
    environment:
      - TZ=Europe/Kyiv
    env_file:
      - .env
    ports:
      - "${WEBHOOK_PORT}:${WEBHOOK_PORT}"
    volumes:
      - .:/bot
    depends_on:
      - redis_cache
      - ngrok
    logging:
      driver: "json-file"
      options:
        max-size: "200k"
        max-file: "10"

  redis_cache:
    image: redis:7.2-alpine
    restart: always
    command: redis-server --port ${REDIS_PORT} --save 20 1 --loglevel warning --requirepass ${REDIS_PASSWORD}
    env_file:
      - ".env"
    volumes:
      - cache:/data
    logging:
      driver: "json-file"
      options:
        max-size: "200k"
        max-file: "10"
    sysctls:
      net.core.somaxconn: 512

  ngrok:
    image: ngrok/ngrok
    restart: always
    command: http --domain=${NGROK_DOMAIN} bot:${WEBHOOK_PORT}
    env_file:
      - ".env"
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    volumes:
      - ./ngrok.yml:/etc/ngrok.yml
    logging:
      driver: "json-file"
      options:
        max-size: "200k"
        max-file: "10"

volumes:
  cache: